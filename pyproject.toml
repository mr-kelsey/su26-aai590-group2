[project]
name = "eia-nowcast-pipeline"
version = "0.0.1"
description = "Nowcasting daily economic impact of California social events from presence proxies"
requires-python = ">=3.11,<3.13"
dependencies = [
    "polars>=1.0",
    "duckdb>=1.0",
    "pyarrow>=16",
    "pandas>=2.0",
    "requests>=2.31",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "tenacity>=8.0",       # retry/backoff for API pulls
    "boto3>=1.34",         # primary AWS call path
    "statsmodels>=0.14.6",
]

[project.optional-dependencies]
model = [
    "statsmodels>=0.14",   # DynamicFactorMQ, SARIMAX, MIDAS-in-state-space
    "numpy>=1.26",
    "scipy>=1.11",
    "lightgbm>=4.3",       # Tier 1 counterfactual forecaster (quantile objective)
    "scikit-learn>=1.4",   # metrics, CV splitters, k-means for cell typology
    "torch>=2.2",          # Tier 2 STGNN; MPS backend on Apple silicon
    # "tempdisagg",        # Chow-Lin / Denton reconciliation baseline (add when needed)
]
aws = [
    "sagemaker<3",         # MUST be <3 — v3 restructured the package and breaks imports
]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eia_pipeline"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
